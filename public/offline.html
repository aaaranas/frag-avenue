<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Offline · Frag Avenue</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f7f6f4;
        --fg: #16150f;
        --muted: #4d4a44;
        --faint: #8f8b7f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0d09;
          --fg: #ecebe6;
          --muted: #d8d6cd;
          --faint: #8f8b7f;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Inter",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .eyebrow {
        color: var(--faint);
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1 {
        font-family: "Cormorant Garamond", ui-serif, Georgia, serif;
        font-size: 2.25rem;
        line-height: 1.15;
        margin: 1rem 0 0;
        font-weight: 500;
      }
      p {
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.6;
        margin-top: 1rem;
      }
      button {
        margin-top: 2rem;
        align-self: flex-start;
        background: var(--fg);
        color: var(--bg);
        border: 0;
        border-radius: 2px;
        padding: 0.625rem 1.25rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Frag Avenue</p>
      <h1>You&rsquo;re offline.</h1>
      <p>
        The page you were trying to reach needs a connection. Reconnect and try again — your
        wardrobe and wear history are stored on the server, unchanged.
      </p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
