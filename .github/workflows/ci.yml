name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    env:
      # Dummy values so env parsing does not blow up during typecheck/test.
      DATABASE_URL: postgresql://frag:frag@localhost:5432/frag_avenue?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://frag:frag@localhost:5432/frag_avenue?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real
      CI: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frag
          POSTGRES_PASSWORD: frag
          POSTGRES_DB: frag_avenue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frag -d frag_avenue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations to test DB
        # Runs the committed migrations rather than `db push`, so a migration
        # that fails to apply fails CI here instead of at deploy time.
        run: pnpm prisma migrate deploy

      - name: Seed
        run: pnpm db:seed

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        # `--with-deps` installs the Ubuntu system libraries once, even on a cache hit.
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
